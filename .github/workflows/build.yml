name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests (LiteMuxCore)
        run: swift test --filter LiteMuxCoreTests

      - name: Build LiteMux.app
        run: ./scripts/bundle.sh

      - name: Size report
        run: |
          du -sh build/LiteMux.app
          ls -l build/LiteMux.app/Contents/MacOS/LiteMux
          otool -L build/LiteMux.app/Contents/MacOS/LiteMux | head -40

      - name: Package
        run: ditto -c -k --keepParent build/LiteMux.app build/LiteMux.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiteMux-app
          path: build/LiteMux.zip
          retention-days: 14
